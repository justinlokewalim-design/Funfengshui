name: Update Lottery Results

on:
  schedule:
    - cron: "30 22 * * 1,4"
    - cron: "30 22 * * 3,6,0"
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Test network access
        run: |
          echo "=== Testing check4d.org ==="
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" "https://www.check4d.org/singapore-4d-results/"
          echo "=== First 500 chars of page ==="
          curl -s -A "Mozilla/5.0 Chrome/124" "https://www.check4d.org/singapore-4d-results/" | head -c 500

      - name: Run scraper
        run: |
          echo "=== Running scraper ==="
          python scraper.py
          echo "=== results.json content ==="
          cat data/results.json

      - name: Commit and push if data changed
        run: |
          git config --global user.name "lottery-bot"
          git config --global user.email "lottery-bot@github-actions"
          git add data/results.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎰 Auto-update lottery results [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
