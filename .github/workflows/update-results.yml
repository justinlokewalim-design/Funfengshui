name: Update Results

on:
  schedule:
    - cron: "30 22 * * 1,3,4,6,0"  # Mon,Wed,Thu,Sat,Sun 22:30 UTC (SGT 06:30)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 -q

      - run: python scraper.py

      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github-actions"
          git add data/results.json
          git diff --staged --quiet || git commit -m "update $(date -u '+%Y-%m-%d')" && git push
